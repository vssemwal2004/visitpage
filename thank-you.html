<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Enquiry received · Graphic Era</title>
  <!-- Shown inside the hero form card after a NoPaperForms submission (set as the widget's redirect URL). -->
  <style>
    @font-face{font-family:"Sora";src:url(assets/fonts/sora.woff2) format("woff2");font-weight:100 800;font-display:swap}
    @font-face{font-family:"Inter";src:url(assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
    :root{--ink:#0A1B3F;--gold:#F5B700;--muted:#55617B;--line:#E2E7F1}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:#fff;color:var(--ink);
      font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
    .done{width:100%;max-width:340px;display:grid;justify-items:center;gap:14px}
    .tick{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
      background:radial-gradient(circle,#FFF6D9 0 62%,transparent 63%);box-shadow:inset 0 0 0 2px var(--gold);animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
    .tick svg{width:34px;height:34px}
    .tick path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .35s ease-out forwards}
    h1{margin:6px 0 0;font-family:"Sora","Inter",sans-serif;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
    p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
    .rule{width:40px;height:3px;border-radius:3px;background:var(--gold);margin-top:4px}
    @keyframes pop{from{transform:scale(.6);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.tick{animation:none}.tick path{animation:none;stroke-dashoffset:0}}
  </style>
</head>
<body>
  <main class="done" role="status">
    <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h1>Enquiry received</h1>
    <span class="rule" aria-hidden="true"></span>
    <p>Our admissions counsellor will call you shortly.</p>
  </main>
</body>
</html>
